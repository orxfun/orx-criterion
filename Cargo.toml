[package]
name = "orx-criterion"
version = "1.0.0"
edition = "2024"
authors = ["orxfun <orx.ugur.arikan@gmail.com>"]
readme = "README.md"
description = "Experimentation library using 'criterion' benchmarks for analyzing alternatives or parameter tuning."
license = "MIT OR Apache-2.0"
repository = "https://github.com/orxfun/orx-criterion/"
keywords = ["criterion", "benchmark", "tuning"]
categories = ["development-tools::profiling"]

[dependencies]
cli-table = { version = "0.5.0", default-features = false }
colorize = { version = "0.1.0", default-features = false }
criterion = { version = "0.8.2", default-features = false }

[dev-dependencies]
orx-parallel = { version = "3.4.0", default-features = false }
orx-priority-queue = { version = "1.8.0", default-features = false }
rand = { version = "0.9.2", default-features = false }
rand_chacha = { version = "0.9", default-features = false }

# Benchmarks

[[bench]]
name = "my_test_bench"
harness = false

[[bench]]
name = "shortest_path"
harness = false

[[bench]]
name = "tuning_example"
harness = false

[[bench]]
name = "two_sum"
harness = false
